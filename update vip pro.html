<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hạt 3D - Voice Control (Fixed)</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: sans-serif; 
        }

        /* KHẮC PHỤC LỖI MẤT HÌNH: Đặt Canvas tuyệt đối */
        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; /* Nằm dưới cùng */
        }

        /* Giao diện điều khiển nằm đè lên trên */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none; /* Để chuột xuyên qua bấm vào 3D nếu cần */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
        }

        #panel {
            background: rgba(30, 30, 40, 0.7);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
            pointer-events: auto; /* Cho phép tương tác */
        }

        #status-text {
            color: #fff; font-size: 20px; font-weight: bold;
            text-transform: uppercase; margin-bottom: 5px;
            min-height: 25px;
            text-shadow: 0 0 10px rgba(0,255,255,0.7);
        }

        #guide {
            color: #aaa; font-size: 12px; margin-top: 5px;
        }

        /* Nút Mic */
        .mic-indicator {
            width: 10px; height: 10px;
            background: red; border-radius: 50%;
            display: inline-block; margin-right: 8px;
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <!-- Layer 3D nằm dưới -->
    <div id="canvas-container"></div>

    <!-- Layer Giao diện nằm trên -->
    <div id="ui-layer">
        <div id="panel">
            <div id="status-text">Đang nghe...</div>
            <div style="display: flex; align-items: center; justify-content: center; margin-top:5px;">
                <span class="mic-indicator"></span>
                <span style="color:#fff; font-size:12px;">Microphone đang bật</span>
            </div>
            <div id="guide">Nói: "To", "Nhỏ", "Nổ", "Xoay", "Tim", "Reset"</div>
        </div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. SETUP THREE.JS (Đảm bảo hiển thị) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 60; // Lùi camera ra xa hơn một chút để dễ thấy
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement); // Gắn vào div cố định

        // --- 2. TẠO HẠT ---
        const PARTICLE_COUNT = 20000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3);

        const colorObj = new THREE.Color();

        // Khởi tạo vị trí ngẫu nhiên
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            positions[i*3] = (Math.random() - 0.5) * 150;
            positions[i*3+1] = (Math.random() - 0.5) * 150;
            positions[i*3+2] = (Math.random() - 0.5) * 150;

            colorObj.setHSL(0.6, 0.8, 0.6); // Màu xanh dương sáng
            colors[i*3] = colorObj.r;
            colors[i*3+1] = colorObj.g;
            colors[i*3+2] = colorObj.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Texture đơn giản (vẽ trực tiếp không cần load ảnh)
        const getSprite = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16,16,0,16,16,16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.4, 'rgba(255,255,255,0.3)');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,32,32);
            return new THREE.Texture(canvas);
        };
        const sprite = getSprite();
        sprite.needsUpdate = true;

        const material = new THREE.PointsMaterial({
            size: 1.2, // Kích thước hạt lớn hơn
            map: sprite,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- 3. HÌNH DÁNG ---
        function getShape(type) {
            const arr = new Float32Array(PARTICLE_COUNT * 3);
            for(let i=0; i<PARTICLE_COUNT; i++) {
                let x,y,z;
                const idx = i*3;
                
                if(type === 'sphere') {
                    const r = 25;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                }
                else if(type === 'heart') {
                    let t = Math.random() * Math.PI * 2;
                    x = 16 * Math.pow(Math.sin(t), 3);
                    y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    z = (Math.random()-0.5) * 5;
                    x*=1.5; y*=1.5; z*=1.5;
                }
                
                arr[idx] = x; arr[idx+1] = y; arr[idx+2] = z;
            }
            return arr;
        }

        // Mặc định hình cầu
        let currentShape = getShape('sphere');
        targetPositions.set(currentShape);

        // --- 4. TRẠNG THÁI & VOICE ---
        const state = {
            scale: 1.0,
            explode: 0,
            rotateSpeed: 0.002
        };

        const statusText = document.getElementById('status-text');

        // Web Speech API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true; // Nhạy
            recognition.lang = 'vi-VN';

            recognition.onresult = (event) => {
                const transcript = event.results[event.resultIndex][0].transcript.toLowerCase();
                statusText.innerText = transcript;
                
                // Logic xử lý lệnh
                if(transcript.includes('to') || transcript.includes('lớn')) state.scale = 2.0;
                if(transcript.includes('nhỏ') || transcript.includes('bé') || transcript.includes('thu')) state.scale = 0.5;
                if(transcript.includes('nổ') || transcript.includes('tán')) state.explode = 5.0;
                if(transcript.includes('xoay')) state.rotateSpeed = 0.05;
                if(transcript.includes('tim') || transcript.includes('yêu')) {
                    targetPositions.set(getShape('heart'));
                    state.explode = 0;
                }
                if(transcript.includes('reset') || transcript.includes('về') || transcript.includes('thường')) {
                    state.scale = 1.0; state.explode = 0; state.rotateSpeed = 0.002;
                    targetPositions.set(getShape('sphere'));
                }
            };
            
            recognition.onend = () => recognition.start(); // Tự bật lại
            recognition.start();
        } else {
            statusText.innerText = "Trình duyệt không hỗ trợ Mic";
        }

        // --- 5. ANIMATION LOOP ---
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Giảm dần độ nổ (hồi phục)
            state.explode += (0 - state.explode) * 0.05;
            
            // Xoay
            particles.rotation.y += state.rotateSpeed;

            const p = particles.geometry.attributes.position.array;
            const c = particles.geometry.attributes.color.array;

            // Update từng hạt
            for(let i=0; i<PARTICLE_COUNT; i++) {
                const idx = i*3;
                const tx = targetPositions[idx];
                const ty = targetPositions[idx+1];
                const tz = targetPositions[idx+2];

                // Tính vị trí đích: Target * Scale + Nổ
                let mx = tx * state.scale;
                let my = ty * state.scale;
                let mz = tz * state.scale;

                if(state.explode > 0.1) {
                    mx += tx * state.explode;
                    my += ty * state.explode;
                    mz += tz * state.explode;
                    
                    // Đổi màu sang đỏ/vàng khi nổ
                    c[idx] = 1; c[idx+1] = 0.8; c[idx+2] = 0;
                } else {
                    // Màu cầu vồng khi bình thường
                    const h = (time * 0.1 + i*0.0001) % 1;
                    colorObj.setHSL(h, 0.8, 0.6);
                    c[idx] = colorObj.r; c[idx+1] = colorObj.g; c[idx+2] = colorObj.b;
                }

                // Di chuyển hạt (Lerp)
                p[idx] += (mx - p[idx]) * 0.1;
                p[idx+1] += (my - p[idx+1]) * 0.1;
                p[idx+2] += (mz - p[idx+2]) * 0.1;
            }

            particles.geometry.attributes.position.needsUpdate = true;
            particles.geometry.attributes.color.needsUpdate = true;
            renderer.render(scene, camera);
        }

        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
